<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🌦️ Weather App</h1>
    <input type="text" id="cityInput" placeholder="Enter city name">
    <button id="searchBtn">Search</button>
    <button id="locBtn">📍 My Location</button>

    <div id="weatherBox" class="hidden">
      <h2 id="cityName"></h2>
      <img id="weatherIcon" alt="Weather Icon">
      <p id="temp"></p>
      <p id="details"></p>
      <p id="extra"></p>
    </div>

    <p id="message"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
